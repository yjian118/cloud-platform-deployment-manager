# How long to wait for the unlock reboot triggered by the deployment manager.
dm_unlock_timeout: 1200

# How long the deployment configuration must have been applied before the
# requests that failed on the system API are reported: sysinv rejecting the
# unlock while puppet is still applying the configuration is expected for the
# first few minutes.
dm_unlock_monitor_delay: 180

# How often the requests that failed on the system API are checked while
# waiting for the reboot.
dm_unlock_monitor_interval: 20
