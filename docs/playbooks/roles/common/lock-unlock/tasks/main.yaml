#
# Waits for the unlock reboot triggered by the deployment manager, and reports
# why the host was not unlocked if it never reboots. The role is tuned through
# the variables in defaults/main.yaml.
- name: Stage the unlock scripts
  include_tasks: prepare.yaml
  when: dm_unlock_staging_dir is not defined

# The reboot task below blocks until the host has rebooted, so the playbook
# cannot report anything while the deployment manager is still retrying.
# Collect the requests that failed on the system API in the background instead
# and report them once the wait is over.
- name: Start monitoring the unlock progress in the background
  include_role:
    name: common/monitor-errors
    tasks_from: start
  vars:
    dm_monitor_errors_delay: "{{ dm_unlock_monitor_delay }}"
    dm_monitor_errors_interval: "{{ dm_unlock_monitor_interval }}"
    dm_monitor_errors_timeout: "{{ dm_unlock_timeout }}"

- name: Wait for the unlock reboot and report the errors
  block:
    - name: Wait unlock reboot
      reboot:
        # did you read the comment in prepare.yaml?
        # The search_paths is defined to restrict the reboot task to look
        # for shutdown in the staging directory, so the fake shutdown will
        # be executed.
        # The reboot is triggered by the unlock operation.
        search_paths:
          - "{{ dm_unlock_staging_dir }}"
        reboot_timeout: "{{ dm_unlock_timeout }}"
      register: unlock_reboot_status

  rescue:
    # Reported further down, once the collected errors are shown.
    - set_fact:
        unlock_reboot_failed: true

  always:
    # Whether the host rebooted or not: stops the collector (killed by the
    # unlock reboot, but not when the host never rebooted), shows what it
    # collected, and removes it from the host. Shown even if the host
    # rebooted, as the deployment manager may have been rejected and retried
    # several times before the unlock succeeded. The failures seen so far are
    # kept out of the reports that follow, e.g. by
    # roles/common/monitor-deployment.
    - name: Stop and clean up the unlock errors monitor
      include_role:
        name: common/monitor-errors
        tasks_from: cleanup

    - name: Remove the fake shutdown from the host
      file:
        path: "{{ dm_unlock_staging_dir }}"
        state: absent
      failed_when: false
      ignore_unreachable: true

- name: Fail if the host did not reboot after the unlock
  fail:
    msg: "{{ unlock_failure_msg + unlock_diagnostics }}"
  vars:
    unlock_failure_msg: >-
      {{ hostname }} did not reboot within {{ dm_unlock_timeout }}s after
      the deployment configuration was applied:
      {{ unlock_reboot_status.msg | default('see the reboot task above') }}
    unlock_diagnostics: >-
      {{
        ['Errors collected while waiting:']
        + (dm_monitor_errors_collected.stdout_lines | default([])
           or ['No errors were collected.'])
      }}
  when: unlock_reboot_failed | default(false) | bool
